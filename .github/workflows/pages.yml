name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm CNAME is in the published files
        run: |
          printf '%s\n' 'www.earresponsible.ca' | cmp -s - CNAME
          tar -cf "$RUNNER_TEMP/pages-check.tar" --exclude=.git --exclude=.github .
          tar -tf "$RUNNER_TEMP/pages-check.tar" | grep -qx './CNAME'

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Set custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${{ github.repository }}/pages" \
            -f cname='www.earresponsible.ca'
